[package]
name = "osrparse-native"
version = "7.0.1"
description = "Native codec for osu! replay files with Python bindings"
repository = "https://github.com/kszlim/osu-replay-parser"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
path = "rust/lib.rs"

[dependencies]
pyo3 = "0.29.2"
liblzma = { version = "0.3.5", default-features = false, features = ["static"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
