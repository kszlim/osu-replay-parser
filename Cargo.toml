[package]
name = "osucore"
version = "8.0.0"
edition = "2021"

[lib]
name = "osucore"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "osucli"
path = "src/main.rs"

[dependencies]
clap = {version = "4.5.27", features = ["derive"] }
nom = "7.1.3"
pyo3 = {version = "0.23", features = ["extension-module", "chrono", "anyhow", "generate-import-lib"]}
anyhow = { version="1.0", features = ["backtrace"] }
nom-leb128 = "0.2.0"
liblzma = {version = "0.3", features = ["parallel", "static"] }
rayon = "1.10.0"
atoi = "2.0.0"
fast-float = "0.2.0"
mimalloc = { version = "*", default-features = false }
once_cell = "1.20.2"
lzma-rs = "0.3.0"

[profile.release]
debug = true
