name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --group docs
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked --group docs sphinx-build -W --keep-going -b html docs build/html
      - run: uv build
      - run: uv run --locked twine check dist/*
      - name: Test installed wheel outside checkout
        run: |
          uv venv /tmp/osrparse-wheel
          uv pip install --python /tmp/osrparse-wheel/bin/python dist/*.whl pytest hypothesis
          cp -r tests /tmp/osrparse-wheel/tests
          cd /tmp/osrparse-wheel
          bin/python -m pytest -q tests
