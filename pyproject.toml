[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "osrparse"
version = "7.0.1"
description = "Parser for osr files and lzma replay streams for osu!"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
keywords = ["osu!", "osr", "replay", "replays", "parsing", "parser", "python"]
authors = [
  {name = "Kevin Lim",  email = "kszlim@gmail.com"      },
  {name = "Liam DeVoe", email = "orionldevoe@gmail.com" }
]
classifiers = [
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]

[project.optional-dependencies]
dev = ["hypothesis>=6"]

[dependency-groups]
dev = ["hypothesis>=6", "pytest>=8", "ruff>=0.11", "twine>=6", "maturin>=1.14,<2"]
docs = ["sphinx>=8", "furo>=2024.8.6"]

[project.urls]
"Homepage" = "https://github.com/kszlim/osu-replay-parser"

[tool.maturin]
module-name = "osrparse._native"
python-source = "."
include = [
  { path = "tests/**", format = "sdist" },
  { path = "docs/**", format = "sdist" },
  { path = "benchmarks/**", format = "sdist" },
  { path = "Makefile", format = "sdist" },
  { path = "uv.lock", format = "sdist" },
  { path = "rust-toolchain.toml", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py310"
include = ["osrparse/**/*.py", "osrparse/**/*.pyi", "docs/conf.py", "pyproject.toml", "tests/test_native_compatibility.py", "benchmarks/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
